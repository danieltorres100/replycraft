    <script>
        let selectedTone = 'Ligar';
        let base64Image = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('replycraft_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        function toggleConfig() {
            const panel = document.getElementById('configPanel');
            panel.classList.toggle('active');
        }

        function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('replycraft_key', key);
                alert('Clave guardada con éxito');
                toggleConfig();
            }
        }

        function selectTone(card, tone) {
            document.querySelectorAll('.tone-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            selectedTone = tone;
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Obtener solo los datos base64 puros
                const result = e.target.result;
                base64Image = result.includes(',') ? result.split(',')[1] : result;
                document.getElementById('imagePreview').src = result;
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function analyzeChat() {
            let apiKey = localStorage.getItem('replycraft_key');
            if (!apiKey) {
                alert('Por favor agrega tu Google AI Studio API Key en el icono de engranaje (⚙️).');
                toggleConfig();
                return;
            }

            apiKey = apiKey.trim();

            if (!base64Image) {
                alert('Sube una captura de pantalla del chat primero.');
                return;
            }

            const btn = document.getElementById('btnGenerate');
            btn.disabled = true;
            btn.innerText = 'Analizando chat con IA...';

            const promptText = `
                Analiza esta captura de pantalla de una conversación de chat.
                Identifica qué dijo la otra persona recientemente.
                Genera 3 opciones distintas de respuesta adaptadas al objetivo: "${selectedTone}".
                
                Devuelve únicamente un JSON válido en este formato exacto sin comillas de código ni markdown:
                {
                    "opcion1": "Texto corto y directo para responder",
                    "opcion2": "Texto un poco más detallado o creativo",
                    "opcion3": "Texto alternativo rompedor"
                }
            `;

            // Probar endpoint primario y secundario en caso de error de modelo
            const models = ['gemini-1.5-flash', 'gemini-2.0-flash-exp'];
            let lastError = null;
            let success = false;

            for (const modelName of models) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: promptText },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        throw new Error(`[${modelName}] ${data.error.message}`);
                    }

                    if (!data.candidates || !data.candidates[0]?.content?.parts[0]?.text) {
                        throw new Error(`[${modelName}] Respuesta de la IA vacía o formato inesperado`);
                    }

                    const rawText = data.candidates[0].content.parts[0].text;
                    const cleanText = rawText.replace(/```json|```/g, '').trim();
                    const cleanJson = JSON.parse(cleanText);

                    document.getElementById('reply1').innerText = cleanJson.opcion1;
                    document.getElementById('reply2').innerText = cleanJson.opcion2;
                    document.getElementById('reply3').innerText = cleanJson.opcion3;

                    document.getElementById('resultsContainer').classList.add('active');
                    success = true;
                    break; // Éxito, salir del loop
                } catch (err) {
                    lastError = err;
                    console.warn(`Falló intento con ${modelName}:`, err);
                }
            }

            if (!success) {
                alert('Error al procesar: ' + (lastError ? lastError.message : 'Error desconocido. Revisa tu clave de Google AI Studio.'));
            }

            btn.disabled = false;
            btn.innerText = '✨ Generar Respuestas';
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('¡Copiado al portapapeles!');
            });
        }
    </script>
