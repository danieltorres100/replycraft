    <script>
        let selectedTone = 'Ligar';
        let base64Image = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('replycraft_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        function toggleConfig() {
            const panel = document.getElementById('configPanel');
            panel.classList.toggle('active');
        }

        function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('replycraft_key', key);
                alert('Clave guardada con éxito');
                toggleConfig();
            }
        }

        function selectTone(card, tone) {
            document.querySelectorAll('.tone-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            selectedTone = tone;
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result; // Mantiene el data:image/jpeg;base64,... completo
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function analyzeChat() {
            const apiKey = localStorage.getItem('replycraft_key');
            if (!apiKey) {
                alert('Por favor agrega tu Venice API Key en el icono de engranaje (⚙️).');
                toggleConfig();
                return;
            }

            if (!base64Image) {
                alert('Sube una captura de pantalla del chat primero.');
                return;
            }

            const btn = document.getElementById('btnGenerate');
            btn.disabled = true;
            btn.innerText = 'Analizando chat con Venice AI...';

            const promptText = `
                Analiza esta captura de pantalla de una conversación de chat.
                Identifica qué dijo la otra persona recientemente.
                Genera 3 opciones distintas de respuesta adaptadas al objetivo: "${selectedTone}".
                
                Devuelve únicamente un JSON válido en este formato exacto sin comillas de código ni markdown:
                {
                    "opcion1": "Texto corto y directo para responder",
                    "opcion2": "Texto un poco más detallado o creativo",
                    "opcion3": "Texto alternativo rompedor"
                }
            `;

            try {
                const response = await fetch('https://api.venice.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'zai-org-glm-5',
                        messages: [
                            {
                                role: 'user',
                                content: [
                                    { type: 'text', text: promptText },
                                    { type: 'image_url', image_url: { url: base64Image } }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                const rawText = data.choices[0].message.content;
                const cleanJson = JSON.parse(rawText.replace(/```json|```/g, '').trim());

                document.getElementById('reply1').innerText = cleanJson.opcion1;
                document.getElementById('reply2').innerText = cleanJson.opcion2;
                document.getElementById('reply3').innerText = cleanJson.opcion3;

                document.getElementById('resultsContainer').classList.add('active');
            } catch (err) {
                alert('Error al analizar la imagen. Revisa tu clave API de Venice o la compatibilidad del modelo visual.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = '✨ Generar Respuestas';
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('¡Copiado al portapapeles!');
            });
        }
    </script>
